name: ClaimTrace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: claimtrace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimtrace-smoke-node-${{ matrix.node }}
          path: test-artifacts/
          if-no-files-found: ignore
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  windows-smoke:
    name: Windows browser smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Browser smoke test
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claimtrace-smoke-windows
          path: test-artifacts/
          if-no-files-found: ignore

  backend-test:
    name: FastAPI backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CLAIMTRACE_OBJECT_STORAGE_MODE: filesystem
      CLAIMTRACE_OBJECT_STORAGE_DIR: ${{ github.workspace }}/backend/.claimtrace-object-store
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Verify migration head
        run: alembic current && alembic heads
      - name: Run backend tests
        run: pytest -q
