# ClaimTrace deployment blueprint
#
# Pilot topology:
#   - claimtrace-web: Vite static frontend on Render CDN
#   - claimtrace-api: FastAPI web service
#   - claimtrace-db: Render Postgres
#
# Production evidence bytes live outside Postgres in immutable S3-compatible object storage.
# Configure bucket-level Object Lock and supply the connection secrets below.

services:
  - type: web
    name: claimtrace-api
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: claimtrace-db
          property: connectionString
      - key: CLAIMTRACE_AUTH_MODE
        value: required
      - key: CLAIMTRACE_SESSION_HOURS
        value: "12"
      - key: CLAIMTRACE_CORS_ORIGINS
        value: "https://claimtrace-web.onrender.com"
      - key: CLAIMTRACE_MAX_UPLOAD_BYTES
        value: "26214400"
      - key: CLAIMTRACE_OBJECT_STORAGE_MODE
        value: s3
      - key: CLAIMTRACE_OBJECT_STORAGE_BUCKET
        sync: false
      - key: CLAIMTRACE_OBJECT_STORAGE_REGION
        value: eu-central-1
      - key: CLAIMTRACE_OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CLAIMTRACE_OBJECT_LOCK_MODE
        value: COMPLIANCE
      - key: CLAIMTRACE_OBJECT_LOCK_DAYS
        value: "90"
      - key: NAHALLM_BASE_URL
        sync: false
      - key: NAHALLM_API_KEY
        sync: false
      - key: CLAIMTRACE_AI_MODEL
        value: fast
      - key: CLAIMTRACE_BOOTSTRAP_EMAIL
        sync: false
      - key: CLAIMTRACE_BOOTSTRAP_PASSWORD
        sync: false
      - key: CLAIMTRACE_BOOTSTRAP_TENANT_ID
        value: TENANT-PILOT
      - key: CLAIMTRACE_BOOTSTRAP_TENANT_NAME
        value: ClaimTrace Pilot

  - type: web
    name: claimtrace-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_CLAIMTRACE_API_BASE
        fromService:
          name: claimtrace-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: claimtrace-db
    region: frankfurt
    plan: free
    databaseName: claimtrace
    user: claimtrace
